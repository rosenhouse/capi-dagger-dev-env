apiVersion: v1
kind: Namespace
metadata:
  name: addon-manager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: addon-manager
  namespace: addon-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: addon-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: addon-manager
subjects:
- kind: ServiceAccount
  name: addon-manager
  namespace: addon-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: addon-manager
  namespace: addon-manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: addon-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: addon-manager
    spec:
      serviceAccountName: addon-manager
      containers:
      - name: manager
        image: addon-manager
