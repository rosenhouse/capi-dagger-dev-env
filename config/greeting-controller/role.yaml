---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: greeting-controller
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - demo.example.com
  resources:
  - greetings
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - demo.example.com
  resources:
  - greetings/finalizers
  verbs:
  - update
