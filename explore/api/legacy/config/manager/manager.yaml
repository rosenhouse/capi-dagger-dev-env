apiVersion: v1
kind: Namespace
metadata:
  name: oldctl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager
  namespace: oldctl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oldctl-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: manager
  namespace: oldctl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  namespace: oldctl
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manager
    spec:
      serviceAccountName: manager
      containers:
      - name: manager
        image: manager
