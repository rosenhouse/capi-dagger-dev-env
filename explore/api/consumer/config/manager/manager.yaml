apiVersion: v1
kind: Namespace
metadata:
  name: legacyctl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  namespace: legacyctl
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manager
    spec:
      containers:
      - name: manager
        image: manager
