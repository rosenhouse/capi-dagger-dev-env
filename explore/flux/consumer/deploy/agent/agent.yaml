apiVersion: v1
kind: Namespace
metadata:
  name: agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: agent
spec:
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
      - name: agent
        image: agent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: agent
spec:
  selector:
    app: agent
  ports:
  - port: 8080
