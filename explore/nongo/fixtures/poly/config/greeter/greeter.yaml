apiVersion: v1
kind: Namespace
metadata:
  name: greeter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter
  namespace: greeter
spec:
  selector:
    matchLabels:
      app: greeter
  template:
    metadata:
      labels:
        app: greeter
    spec:
      containers:
      - name: greeter
        image: greeter
        readinessProbe:
          httpGet: {path: /, port: 8080}
