apiVersion: v1
kind: Namespace
metadata:
  name: poly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  namespace: poly
spec:
  selector:
    matchLabels:
      app: manager
  template:
    metadata:
      labels:
        app: manager
    spec:
      containers:
      - name: manager
        image: manager
