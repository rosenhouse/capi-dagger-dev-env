apiVersion: v1
kind: Namespace
metadata:
  name: typo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: typo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      containers:
      - name: hello
        image: helo
