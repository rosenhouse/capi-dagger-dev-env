apiVersion: v1
kind: Namespace
metadata:
  name: good
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: good
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      containers:
      - name: hello
        image: hello
