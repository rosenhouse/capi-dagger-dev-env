apiVersion: v1
kind: Namespace
metadata:
  name: probe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: probe
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      containers:
      - name: hello
        image: hello
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          periodSeconds: 5
