apiVersion: v1
kind: Namespace
metadata:
  name: crash
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: crash
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      containers:
      - name: hello
        image: hello
        args: ["--metrics-bind-address=:8443"]
