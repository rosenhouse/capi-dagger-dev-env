apiVersion: v1
kind: Namespace
metadata:
  name: nocrd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: nocrd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      containers:
      - name: hello
        image: hello
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hello
  namespace: nocrd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  endpoints:
  - port: metrics
