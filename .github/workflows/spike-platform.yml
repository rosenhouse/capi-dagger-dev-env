name: spike-platform
on:
  pull_request:
    branches: [smol]
    paths:
      - .github/workflows/spike-platform.yml
      - hack/spike/platform/**
  workflow_dispatch:
concurrency:
  group: spike-platform-${{ github.ref }}
  cancel-in-progress: true
env:
  SMOLVM_VERSION: 1.22.0
  SMOLVM_IDLE_RECLAIM: "off"
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        shmem-thp: [never, always]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./hack/spike/platform/setup
        with:
          shmem-thp: ${{ matrix.shmem-thp }}
      - run: hack/spike/platform/run.sh host-tools
      - name: Boot a bare VM and install tools
        run: hack/spike/platform/run.sh boot
      - name: Start dockerd and probe the kernel
        run: hack/spike/platform/run.sh docker
      - name: Session registry and Kind management cluster
        run: hack/spike/platform/run.sh mgmt
      - name: Cluster API, kapp-controller and the workload cluster
        run: hack/spike/platform/run.sh platform
      - run: hack/spike/platform/run.sh resources before-branch plat
      - name: Branch with published ports
        run: hack/spike/platform/run.sh branch
      - name: Both API servers from the host
        run: hack/spike/platform/run.sh host-access
      - name: Push through the branch port and run the image in both clusters
        run: hack/spike/platform/run.sh registry
      - run: hack/spike/platform/run.sh resources after-branch env
      - if: always()
        run: hack/spike/platform/run.sh summary
      - if: failure()
        run: hack/spike/platform/run.sh diag
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-shmem-thp-${{ matrix.shmem-thp }}
          path: |
            ${{ runner.temp }}/platform/
            !${{ runner.temp }}/platform/bin/
            !${{ runner.temp }}/platform/*.tgz
            !${{ runner.temp }}/platform/*.kubeconfig
          retention-days: 7
  branch-memory:
    strategy:
      fail-fast: false
      matrix:
        shmem-thp: [never, always]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./hack/spike/platform/setup
        with:
          shmem-thp: ${{ matrix.shmem-thp }}
      - run: hack/spike/platform/branch-memory.sh
