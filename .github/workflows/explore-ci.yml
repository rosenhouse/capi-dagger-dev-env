name: explore-ci
on:
  push:
    branches: [claude/dagger-exploratory-testing-pjzg3f]
    paths: ['explore/ci/**', '.github/workflows/explore-ci.yml']
jobs:
  scenario:
    strategy:
      fail-fast: false
      matrix:
        script:
          - proxy.sh localhost,127.0.0.1,docker,.dagger.local
          - offline.sh
          - gitlab-dind.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: bash explore/ci/${{ matrix.script }}
