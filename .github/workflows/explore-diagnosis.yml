name: explore-diagnosis
on:
  push:
    branches: [claude/dagger-exploratory-testing-pjzg3f]
    paths: ['explore/diagnosis/**', '.github/workflows/explore-diagnosis.yml']
jobs:
  diagnosis:
    strategy:
      fail-fast: false
      matrix:
        job: [manifests, hooks, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: explore/diagnosis/run.sh ${{ matrix.job }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-${{ matrix.job }}
          path: ${{ runner.temp }}/diag-src/.devenv/
          include-hidden-files: true
          retention-days: 3
