name: ci
on:
  push:
    branches: [main]
  pull_request:
# A new push to a pull request cancels its older runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./... ./examples/greeting/...
      - run: go test ./... ./examples/greeting/...
      - run: go generate ./... ./examples/greeting/...
      # The example's images build from its own go.mod, so it must match the workspace.
      - run: go work sync
      - run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
  devenv-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/greeting
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: go test ./devenv/build/ ./devenv/infra/
        working-directory: .
        env:
          DEVENV_ENGINE_TESTS: "1"
      - run: go run ./cmd/devenv test --name ci
      # A second run with the same name checks cleanup, lock release and cache reuse.
      - run: go run ./cmd/devenv test --name ci
      - run: go run ./cmd/devenv down --name ci --purge && test ! -e .devenv/ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devenv-${{ matrix.runner }}
          path: examples/greeting/.devenv/
          include-hidden-files: true
  concurrent-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/greeting
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Two environments at once, one with a random name
        shell: bash
        timeout-minutes: 25
        run: |
          go build -o /tmp/devenv ./cmd/devenv
          (while sleep 5; do df --output=used -B1G / | tail -1; done > /tmp/df.log) &
          /tmp/devenv test --name a 2>&1 | sed -u 's/^/[a] /' & a=$!
          /tmp/devenv test 2>&1 | sed -u 's/^/[random] /' & r=$!
          status=0
          wait $a || status=1
          wait $r || status=1
          echo "Peak disk use: $(sort -n /tmp/df.log | tail -1) GB of $(df --output=size -B1G / | tail -1) GB"
          exit $status
      - run: test "$(ls .devenv)" = a
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devenv-concurrent
          path: examples/greeting/.devenv/
          include-hidden-files: true
