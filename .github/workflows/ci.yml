name: ci
on:
  push:
    branches: [smol]
  pull_request:
    branches: [smol]
  workflow_dispatch:
# A new push to a pull request cancels its older runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  SMOLVM_VERSION: 1.22.0
  SMOLVM_LINUX_X86_64_SHA256: 00d2f057c963ff950846d4059af87bdddb7edf707750cdab863cb0879d6b339e
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go generate ./...
      - run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
  smolvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SMOLVM_IDLE_RECLAIM: "off"
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -w /dev/kvm
          grep -m1 'model name' /proc/cpuinfo
      # smolvm expands disk templates beside its binary, so it needs a writable directory.
      - name: Install smolvm
        run: |
          curl -fsSLo "$RUNNER_TEMP/smolvm.tar.gz" "https://github.com/smol-machines/smolvm/releases/download/v$SMOLVM_VERSION/smolvm-$SMOLVM_VERSION-linux-x86_64.tar.gz"
          echo "$SMOLVM_LINUX_X86_64_SHA256  $RUNNER_TEMP/smolvm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/smolvm.tar.gz" -C "$HOME"
          echo "$HOME/smolvm-$SMOLVM_VERSION-linux-x86_64" >>"$GITHUB_PATH"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -v ./internal/devenv/smolvm/
        env:
          DEVENV_SMOLVM_TESTS: "1"
          DEVENV_SMOLVM_LOGS: ${{ runner.temp }}/smolvm-logs
      - name: Keep console logs of machines left running
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/smolvm-logs"
          for m in $(smolvm machine ls -q); do
            cp "$(smolvm machine data-dir --name "$m")/agent-console.log" "$RUNNER_TEMP/smolvm-logs/$m-agent-console.log" || true
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smolvm-logs
          path: ${{ runner.temp }}/smolvm-logs
