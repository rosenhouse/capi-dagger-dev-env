name: ci
on:
  push:
    branches: [smol]
  pull_request:
    branches: [smol]
  workflow_dispatch:
# A new push to a pull request cancels its older runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  SMOLVM_VERSION: 1.22.0
  SMOLVM_LINUX_X86_64_SHA256: 00d2f057c963ff950846d4059af87bdddb7edf707750cdab863cb0879d6b339e
defaults:
  run:
    shell: bash
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go generate ./...
      - run: go mod tidy
      - run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
  smolvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/smolvm
        with:
          version: ${{ env.SMOLVM_VERSION }}
          sha256: ${{ env.SMOLVM_LINUX_X86_64_SHA256 }}
      - run: go test -v ./internal/devenv/smolvm/
        env:
          DEVENV_SMOLVM_TESTS: "1"
          DEVENV_SMOLVM_LOGS: ${{ runner.temp }}/smolvm-logs
      - name: Keep console logs of machines left running
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/smolvm-logs"
          for m in $(smolvm machine ls -q); do
            cp "$(smolvm machine data-dir --name "$m")/agent-console.log" "$RUNNER_TEMP/smolvm-logs/$m-agent-console.log" || true
          done
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smolvm-logs
          path: ${{ runner.temp }}/smolvm-logs
  # Only CI on smol publishes checkpoints, and only for AMD EPYC 7763, which runs about half of the jobs:
  # each checkpoint takes about 3 GB of the repository's 10 GB cache, which main's CI shares.
  # Runners land on random CPUs, so four jobs make one on a 7763 likely.
  # A manual run on another branch tests this job without publishing.
  platform:
    if: github.event_name != 'pull_request'
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Publish for this CPU?
        id: cpu
        run: |
          if grep -q '^model name.*AMD EPYC 7763 ' /proc/cpuinfo; then publish=true; else publish=false; fi
          echo "publish=$publish" | tee -a "$GITHUB_OUTPUT"
      - if: steps.cpu.outputs.publish == 'true'
        uses: ./.github/actions/smolvm
        with:
          version: ${{ env.SMOLVM_VERSION }}
          sha256: ${{ env.SMOLVM_LINUX_X86_64_SHA256 }}
      - if: steps.cpu.outputs.publish == 'true'
        uses: ./.github/actions/platform-cache
        id: cache
        with:
          lookup-only: true
          capture-on-miss: true
      # Only a checkpoint that restores and passes the tests is published, as a published key is never replaced.
      - name: devenv test --warm
        id: verify
        if: steps.cpu.outputs.publish == 'true' && steps.cache.outputs.hit != 'true'
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/devenv" test --warm --name verify 2>&1 | tee "$RUNNER_TEMP/verify.log"
          echo "$SECONDS" >"$RUNNER_TEMP/verify.log.seconds"
      - if: steps.verify.outcome == 'success' && github.ref == 'refs/heads/smol'
        run: echo "$EPOCHREALTIME" >"$RUNNER_TEMP/cache-save.start"
      - if: steps.verify.outcome == 'success' && github.ref == 'refs/heads/smol'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/devenv/platform
          key: ${{ steps.cache.outputs.key }}
      - name: Delete superseded checkpoints
        if: steps.verify.outcome == 'success' && github.ref == 'refs/heads/smol'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ steps.cache.outputs.key }}
        run: |
          gh cache list --ref "$GITHUB_REF" --key devenv-platform- --limit 100 --json id,key --jq ".[] | select(.key != \"$KEY\") | .id" |
            while read -r id; do gh cache delete "$id" || true; done
      - name: Summary
        if: always() && steps.cpu.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ steps.cache.outputs.key }}
        run: |
          if [ -f "$RUNNER_TEMP/cache-save.start" ]; then
            echo "| Cache save | $(awk "BEGIN { printf \"%.1f\", $EPOCHREALTIME - $(cat "$RUNNER_TEMP/cache-save.start") }") s |" >>"$RUNNER_TEMP/platform.md"
            echo "| Cache entry | $(gh cache list --key "$KEY" --json sizeInBytes --jq '.[0].sizeInBytes // 0 | . / 1048576 | floor') MiB |" >>"$RUNNER_TEMP/platform.md"
          fi
          echo "| Repository cache | $(gh api "repos/$GH_REPO/actions/cache/usage" --jq '.active_caches_size_in_bytes / 1048576 | floor') MiB |" >>"$RUNNER_TEMP/platform.md"
          {
            cat "$RUNNER_TEMP/platform.md"
            echo
            echo "The repository's largest caches:"
            gh cache list --sort size_in_bytes --limit 10 --json key,ref,sizeInBytes --jq '.[] | "- \(.sizeInBytes / 1048576 | floor) MiB, \(.ref): \(.key)"'
            echo
            .github/ci/timings.sh "save=$RUNNER_TEMP/save.log" "test --warm=$RUNNER_TEMP/verify.log"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: platform-save-${{ matrix.job }}
          path: |
            ~/.cache/devenv/platform-save/
            .devenv/
          include-hidden-files: true
  # On smol, devenv and concurrent wait for platform, so that they restore what it published.
  devenv:
    needs: platform
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/smolvm
        with:
          version: ${{ env.SMOLVM_VERSION }}
          sha256: ${{ env.SMOLVM_LINUX_X86_64_SHA256 }}
      - uses: ./.github/actions/platform-cache
        with:
          capture-on-miss: true
      - name: devenv test
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/devenv" test --warm --name ci 2>&1 | tee "$RUNNER_TEMP/test.log"
          echo "$SECONDS" >"$RUNNER_TEMP/test.log.seconds"
      - name: Interrupt up while it restores its VM
        timeout-minutes: 5
        run: |
          setsid "$RUNNER_TEMP/devenv" up --warm --name interrupted 2>"$RUNNER_TEMP/interrupt.log" & pid=$!
          until pgrep -f -- '--from .*/restoring/' >/dev/null; do kill -0 "$pid"; sleep 0.1; done
          # A terminal's Ctrl-C signals the whole process group.
          kill -INT -- "-$pid"
          status=0
          wait "$pid" || status=$?
          cat "$RUNNER_TEMP/interrupt.log"
          test "$status" -ne 0
          grep -q 'interrupted; devenv deletes the VM once smolvm has restored it' "$RUNNER_TEMP/interrupt.log"
          grep -q 'interrupted; deleted the VM' "$RUNNER_TEMP/interrupt.log"
          "$RUNNER_TEMP/devenv" down --name interrupted --purge
          test -z "$(smolvm machine ls -q)"
      - name: devenv test again
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/devenv" test --warm --name ci 2>&1 | tee "$RUNNER_TEMP/again.log"
          echo "$SECONDS" >"$RUNNER_TEMP/again.log.seconds"
      # This reuses the name, and runs each command as a developer would.
      # Pruning smolvm's extracted checkpoint makes up extract it again, as the first test did, but without its cold build.
      - name: up, status, kubeconfig, redeploy and down
        timeout-minutes: 15
        run: |
          smolvm pack prune --all
          go run ./cmd/devenv up --warm --name ci 2>&1 | tee "$RUNNER_TEMP/up.log"
          go run ./cmd/devenv status | tee "$RUNNER_TEMP/status.txt"
          grep -qE '^ci +running +[0-9]+ +[0-9]+ +[0-9]+ ' "$RUNNER_TEMP/status.txt"
          go run ./cmd/devenv kubeconfig --cluster workload >"$RUNNER_TEMP/workload.kubeconfig"
          kubectl --kubeconfig "$RUNNER_TEMP/workload.kubeconfig" get nodes
          go run ./cmd/devenv redeploy --name ci --version ci-redeploy 2>&1 | tee "$RUNNER_TEMP/redeploy.log"
          go run ./cmd/devenv down --name ci --purge
          test ! -e .devenv/ci
      - name: No VMs left
        run: |
          smolvm machine ls
          test -z "$(smolvm machine ls -q)"
          ! pgrep -af _boot-vm
      - name: Summary
        if: always()
        run: |
          {
            cat "$RUNNER_TEMP/platform.md"
            echo "| smolvm's extracted checkpoints after down | $(du -sm ~/.cache/smolvm/vms/_shared 2>/dev/null | cut -f1) MiB |"
            echo "| Disk used after down | $(df --output=used -BG / | tail -1 | tr -d ' ') |"
            echo
            .github/ci/timings.sh "save=$RUNNER_TEMP/save.log" "test=$RUNNER_TEMP/test.log" "test again=$RUNNER_TEMP/again.log" \
              "up=$RUNNER_TEMP/up.log" "redeploy=$RUNNER_TEMP/redeploy.log"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: devenv
          path: |
            .devenv/
            ~/.cache/devenv/platform-save/
          include-hidden-files: true
  devenv-cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/smolvm
        with:
          version: ${{ env.SMOLVM_VERSION }}
          sha256: ${{ env.SMOLVM_LINUX_X86_64_SHA256 }}
      - run: go build -o "$RUNNER_TEMP/devenv" ./cmd/devenv
      - name: devenv test --cold
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/devenv" test --cold --name ci 2>&1 | tee "$RUNNER_TEMP/test.log"
          echo "$SECONDS" >"$RUNNER_TEMP/test.log.seconds"
      - name: Interrupt up while its VM starts
        timeout-minutes: 5
        run: |
          setsid "$RUNNER_TEMP/devenv" up --cold --name interrupted 2>"$RUNNER_TEMP/interrupt.log" & pid=$!
          until pgrep -f _boot-vm >/dev/null; do kill -0 "$pid"; sleep 0.1; done
          # A terminal's Ctrl-C signals the whole process group.
          kill -INT -- "-$pid"
          status=0
          wait "$pid" || status=$?
          cat "$RUNNER_TEMP/interrupt.log"
          test "$status" -ne 0
          grep -q 'interrupted; deleted the VM' "$RUNNER_TEMP/interrupt.log"
          "$RUNNER_TEMP/devenv" down --name interrupted --purge
      - name: No VMs left
        run: |
          smolvm machine ls
          test -z "$(smolvm machine ls -q)"
          ! pgrep -af _boot-vm
      - name: Summary
        if: always()
        run: |
          {
            echo "| Runner | |"
            echo "| --- | --- |"
            echo "| CPU | $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs) |"
            echo
            .github/ci/timings.sh "test --cold=$RUNNER_TEMP/test.log"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: devenv-cold
          path: .devenv/
          include-hidden-files: true
  concurrent:
    needs: platform
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/smolvm
        with:
          version: ${{ env.SMOLVM_VERSION }}
          sha256: ${{ env.SMOLVM_LINUX_X86_64_SHA256 }}
      - uses: ./.github/actions/platform-cache
        with:
          capture-on-miss: true
      - name: Two environments at once, one with a random name
        timeout-minutes: 30
        run: |
          say() { echo "$*" >>"$RUNNER_TEMP/concurrent.md"; }
          say "Before: $(free -m | awk '/^Mem:/ { print $3 }') MiB of memory and $(df --output=used -BG / | tail -1 | tr -d ' ') of disk used."
          vms_rss() {
            for pid in $(smolvm machine ls --json | jq -r '.[].pid // empty'); do
              sudo awk '/^VmRSS:/ { print $2 }' "/proc/$pid/status" 2>/dev/null
            done | awk '{ s += $1 } END { print int(s / 1024) }'
          }
          # Each sample: host memory used and the VMs' RSS in MiB, and disk used in GB.
          (while sleep 5; do
            echo "$(free -m | awk '/^Mem:/ { print $3 }') $(vms_rss) $(df --output=used -BG / | tail -1 | tr -d ' G')"
          done >"$RUNNER_TEMP/usage.log") & sampler=$!
          trap 'kill $sampler' EXIT
          "$RUNNER_TEMP/devenv" test --warm --name a 2>&1 | sed -u 's/^/[a] /' | tee "$RUNNER_TEMP/a.log" & a=$!
          "$RUNNER_TEMP/devenv" test --warm 2>&1 | sed -u 's/^/[random] /' | tee "$RUNNER_TEMP/random.log" & r=$!
          status=0
          wait $a || status=1
          wait $r || status=1
          peak() { cut -d' ' -f"$1" "$RUNNER_TEMP/usage.log" | sort -n | tail -1; }
          say "Peak: $(peak 1) MiB of $(free -m | awk '/^Mem:/ { print $2 }') MiB memory used, $(peak 2) MiB of it by the VMs;" \
            "$(peak 3) GB of $(df --output=size -BG / | tail -1 | tr -d ' ') disk used."
          say "Both tests took $SECONDS s."
          exit $status
      - run: test "$(ls .devenv)" = a
      - name: No VMs left
        run: |
          test -z "$(smolvm machine ls -q)"
          ! pgrep -af _boot-vm
      - name: Summary
        if: always()
        run: |
          {
            cat "$RUNNER_TEMP/platform.md"
            echo
            echo "### Two environments at once"
            cat "$RUNNER_TEMP/concurrent.md" || true
            echo
            .github/ci/timings.sh "save=$RUNNER_TEMP/save.log" "a=$RUNNER_TEMP/a.log" "random=$RUNNER_TEMP/random.log"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: devenv-concurrent
          path: |
            .devenv/
            ~/.cache/devenv/platform-save/
          include-hidden-files: true
