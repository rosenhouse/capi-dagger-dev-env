name: ci
on:
  push:
    branches: [smol]
  pull_request:
    branches: [smol]
  workflow_dispatch:
# A new push to a pull request cancels its older runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  SMOLVM_VERSION: 1.22.0
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go generate ./...
      - run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
  smolvm-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -w /dev/kvm
          grep -m1 'model name' /proc/cpuinfo
      - name: Install smolvm
        run: |
          curl -fsSL "https://raw.githubusercontent.com/smol-machines/smolvm/v${SMOLVM_VERSION}/scripts/install.sh" | bash -s -- --version "$SMOLVM_VERSION"
          echo "$HOME/.smolvm" >> "$GITHUB_PATH"
      - run: smolvm --version
      - run: time smolvm machine run --net --image alpine -- uname -a
      - name: Guest kernel config
        run: |
          smolvm machine run --net --image alpine -- sh -c 'zcat /proc/config.gz 2>/dev/null || echo no /proc/config.gz; cat /proc/filesystems; ls /sys/fs/cgroup; cat /sys/fs/cgroup/cgroup.controllers' > guest-kernel.txt || true
          grep -E 'CONFIG_(MODULES|BRIDGE|BRIDGE_NETFILTER|VETH|VXLAN|IP_VS|IP_SET|NETFILTER_XT_MATCH_(STATISTIC|CONNTRACK|COMMENT|MULTIPORT|ADDRTYPE|PHYSDEV|MARK)|NETFILTER_XT_TARGET_(MASQUERADE|REDIRECT|MARK)|NF_TABLES|NFT_COMPAT|NF_NAT|OVERLAY_FS|MEMCG|CGROUP_BPF|SECCOMP_FILTER|USER_NS|FUSE_FS|BLK_DEV_LOOP)=' guest-kernel.txt || cat guest-kernel.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-kernel
          path: guest-kernel.txt
