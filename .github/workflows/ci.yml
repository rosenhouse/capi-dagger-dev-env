name: ci
on:
  push:
    branches: [smol]
  pull_request:
    branches: [smol]
  workflow_dispatch:
# A new push to a pull request cancels its older runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  SMOLVM_VERSION: 1.22.0
  SMOLVM_LINUX_X86_64_SHA256: 00d2f057c963ff950846d4059af87bdddb7edf707750cdab863cb0879d6b339e
defaults:
  run:
    shell: bash
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go generate ./...
      - run: go mod tidy
      - run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
  smolvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/smolvm
        with:
          version: ${{ env.SMOLVM_VERSION }}
          sha256: ${{ env.SMOLVM_LINUX_X86_64_SHA256 }}
      - run: go test -v ./internal/devenv/smolvm/
        env:
          DEVENV_SMOLVM_TESTS: "1"
          DEVENV_SMOLVM_LOGS: ${{ runner.temp }}/smolvm-logs
      - name: Keep console logs of machines left running
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/smolvm-logs"
          for m in $(smolvm machine ls -q); do
            cp "$(smolvm machine data-dir --name "$m")/agent-console.log" "$RUNNER_TEMP/smolvm-logs/$m-agent-console.log" || true
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smolvm-logs
          path: ${{ runner.temp }}/smolvm-logs
  # Only post-merge CI publishes checkpoints. Runners land on random CPUs, so three jobs warm several contracts.
  platform:
    if: github.event_name == 'push' && github.ref == 'refs/heads/smol'
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/smolvm
        with:
          version: ${{ env.SMOLVM_VERSION }}
          sha256: ${{ env.SMOLVM_LINUX_X86_64_SHA256 }}
      - uses: ./.github/actions/platform-cache
        id: cache
        with:
          lookup-only: true
          save-on-miss: true
      - if: steps.cache.outputs.hit != 'true'
        run: echo "$EPOCHREALTIME" >"$RUNNER_TEMP/cache-save.start"
      - if: steps.cache.outputs.hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/devenv/platform
          key: ${{ steps.cache.outputs.key }}
      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/cache-save.start" ]; then
            echo "| Cache save | $(awk "BEGIN { printf \"%.1f\", $EPOCHREALTIME - $(cat "$RUNNER_TEMP/cache-save.start") }") s |" >>"$RUNNER_TEMP/platform.md"
          fi
          { cat "$RUNNER_TEMP/platform.md"; echo; .github/ci/timings.sh "save=$RUNNER_TEMP/save.log"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-save-${{ matrix.job }}
          path: ~/.cache/devenv/platform-save/
  devenv:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/smolvm
        with:
          version: ${{ env.SMOLVM_VERSION }}
          sha256: ${{ env.SMOLVM_LINUX_X86_64_SHA256 }}
      - uses: ./.github/actions/platform-cache
        with:
          save-on-miss: true
      - name: devenv test
        timeout-minutes: 15
        run: |
          go run ./cmd/devenv test --name ci 2>&1 | tee "$RUNNER_TEMP/test.log"
          echo "$SECONDS" >"$RUNNER_TEMP/test.log.seconds"
      - name: devenv test again
        timeout-minutes: 15
        run: |
          go run ./cmd/devenv test --name ci 2>&1 | tee "$RUNNER_TEMP/again.log"
          echo "$SECONDS" >"$RUNNER_TEMP/again.log.seconds"
      # This reuses the name, and runs each command as a developer would.
      - name: up, status, kubeconfig, redeploy and down
        timeout-minutes: 15
        run: |
          go run ./cmd/devenv up --name ci 2>&1 | tee "$RUNNER_TEMP/up.log"
          go run ./cmd/devenv status | tee "$RUNNER_TEMP/status.txt"
          grep -qE '^ci +running +[0-9]+ +[0-9]+ +[0-9]+ ' "$RUNNER_TEMP/status.txt"
          go run ./cmd/devenv kubeconfig --cluster workload >"$RUNNER_TEMP/workload.kubeconfig"
          kubectl --kubeconfig "$RUNNER_TEMP/workload.kubeconfig" get nodes
          go run ./cmd/devenv redeploy --name ci --version ci-redeploy 2>&1 | tee "$RUNNER_TEMP/redeploy.log"
          go run ./cmd/devenv down --name ci --purge
          test ! -e .devenv/ci
      - name: No VMs left
        run: |
          smolvm machine ls
          test -z "$(smolvm machine ls -q)"
          ! pgrep -af _boot-vm
      - name: Summary
        if: always()
        run: |
          {
            cat "$RUNNER_TEMP/platform.md"
            echo
            .github/ci/timings.sh "save=$RUNNER_TEMP/save.log" "test=$RUNNER_TEMP/test.log" "test again=$RUNNER_TEMP/again.log" \
              "up=$RUNNER_TEMP/up.log" "redeploy=$RUNNER_TEMP/redeploy.log"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devenv
          path: |
            .devenv/
            ~/.cache/devenv/platform-save/
          include-hidden-files: true
  devenv-cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/smolvm
        with:
          version: ${{ env.SMOLVM_VERSION }}
          sha256: ${{ env.SMOLVM_LINUX_X86_64_SHA256 }}
      - run: go build -o "$RUNNER_TEMP/devenv" ./cmd/devenv
      - name: devenv test --cold
        timeout-minutes: 15
        run: |
          go run ./cmd/devenv test --cold --name ci 2>&1 | tee "$RUNNER_TEMP/test.log"
          echo "$SECONDS" >"$RUNNER_TEMP/test.log.seconds"
      - name: Interrupt up while its VM starts
        timeout-minutes: 5
        run: |
          setsid "$RUNNER_TEMP/devenv" up --cold --name interrupted 2>"$RUNNER_TEMP/interrupt.log" & pid=$!
          until pgrep -f _boot-vm >/dev/null; do kill -0 "$pid"; sleep 0.1; done
          # A terminal's Ctrl-C signals the whole process group.
          kill -INT -- "-$pid"
          status=0
          wait "$pid" || status=$?
          cat "$RUNNER_TEMP/interrupt.log"
          test "$status" -ne 0
          grep -q 'interrupted; deleted the VM' "$RUNNER_TEMP/interrupt.log"
          "$RUNNER_TEMP/devenv" down --name interrupted --purge
      - name: No VMs left
        run: |
          smolvm machine ls
          test -z "$(smolvm machine ls -q)"
          ! pgrep -af _boot-vm
      - name: Summary
        if: always()
        run: |
          {
            echo "| Runner | |"
            echo "| --- | --- |"
            echo "| CPU | $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs) |"
            echo
            .github/ci/timings.sh "test --cold=$RUNNER_TEMP/test.log"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devenv-cold
          path: .devenv/
          include-hidden-files: true
  concurrent:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/smolvm
        with:
          version: ${{ env.SMOLVM_VERSION }}
          sha256: ${{ env.SMOLVM_LINUX_X86_64_SHA256 }}
      - uses: ./.github/actions/platform-cache
        with:
          save-on-miss: true
      - name: Two environments at once, one with a random name
        timeout-minutes: 30
        run: |
          say() { echo "$*" >>"$RUNNER_TEMP/concurrent.md"; }
          say "Before: $(free -m | awk '/^Mem:/ { print $3 }') MiB of memory and $(df --output=used -BG / | tail -1 | tr -d ' ') of disk used."
          vms_rss() {
            for pid in $(smolvm machine ls --json | jq -r '.[].pid // empty'); do
              sudo awk '/^VmRSS:/ { print $2 }' "/proc/$pid/status" 2>/dev/null
            done | awk '{ s += $1 } END { print int(s / 1024) }'
          }
          # Each sample: host memory used and the VMs' RSS in MiB, and disk used in GB.
          (while sleep 5; do
            echo "$(free -m | awk '/^Mem:/ { print $3 }') $(vms_rss) $(df --output=used -BG / | tail -1 | tr -d ' G')"
          done >"$RUNNER_TEMP/usage.log") & sampler=$!
          trap 'kill $sampler' EXIT
          "$RUNNER_TEMP/devenv" test --name a 2>&1 | sed -u 's/^/[a] /' | tee "$RUNNER_TEMP/a.log" & a=$!
          "$RUNNER_TEMP/devenv" test 2>&1 | sed -u 's/^/[random] /' | tee "$RUNNER_TEMP/random.log" & r=$!
          status=0
          wait $a || status=1
          wait $r || status=1
          peak() { cut -d' ' -f"$1" "$RUNNER_TEMP/usage.log" | sort -n | tail -1; }
          say "Peak: $(peak 1) MiB of $(free -m | awk '/^Mem:/ { print $2 }') MiB memory used, $(peak 2) MiB of it by the VMs;" \
            "$(peak 3) GB of $(df --output=size -BG / | tail -1 | tr -d ' ') disk used."
          say "Both tests took $SECONDS s."
          exit $status
      - run: test "$(ls .devenv)" = a
      - name: No VMs left
        run: |
          test -z "$(smolvm machine ls -q)"
          ! pgrep -af _boot-vm
      - name: Summary
        if: always()
        run: |
          {
            cat "$RUNNER_TEMP/platform.md"
            echo
            echo "### Two environments at once"
            cat "$RUNNER_TEMP/concurrent.md" || true
            echo
            .github/ci/timings.sh "save=$RUNNER_TEMP/save.log" "a=$RUNNER_TEMP/a.log" "random=$RUNNER_TEMP/random.log"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devenv-concurrent
          path: |
            .devenv/
            ~/.cache/devenv/platform-save/
          include-hidden-files: true
