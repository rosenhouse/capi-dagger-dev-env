name: ci
on:
  push:
    branches: [main]
  pull_request:
# A new push to a pull request cancels its older runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: go generate ./...
      - run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
  devenv-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./internal/devenv/build/
        env:
          DEVENV_ENGINE_TESTS: "1"
      - run: go run ./cmd/devenv test --name ci
      # A second run with the same name checks cleanup, lock release and cache reuse.
      - run: go run ./cmd/devenv test --name ci
      - run: go run ./cmd/devenv down --name ci --purge && test ! -e .devenv/ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devenv-${{ matrix.runner }}
          path: .devenv/
          include-hidden-files: true
  concurrent-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Also starts the shared Dagger engine before two clients race to start it.
      - run: go test ./internal/devenv/build/
        env:
          DEVENV_ENGINE_TESTS: "1"
      - name: Two environments at once, one with a random name
        run: |
          go build -o /tmp/devenv ./cmd/devenv
          df -h /
          /tmp/devenv test --name a > a.log 2>&1 & a=$!
          /tmp/devenv test > random.log 2>&1 & r=$!
          status=0
          wait $a || status=1
          wait $r || status=1
          sed 's/^/[a] /' a.log
          sed 's/^/[random] /' random.log
          df -h /
          exit $status
      - run: test "$(ls .devenv)" = a
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devenv-concurrent
          path: .devenv/
          include-hidden-files: true
