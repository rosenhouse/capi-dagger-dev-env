name: explore-api
on:
  push:
    branches: [claude/dagger-exploratory-testing-pjzg3f]
    paths: ['explore/api/**', '.github/workflows/explore-api.yml']
jobs:
  explore:
    strategy:
      fail-fast: false
      matrix:
        script: [run-gotest.sh, run-cli-hooks.sh, run-edge.sh]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: bash explore/api/${{ matrix.script }}
