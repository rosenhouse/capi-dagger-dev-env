name: explore-nongo
on:
  push:
    branches: [claude/dagger-exploratory-testing-pjzg3f]
    paths: ['explore/nongo/**', '.github/workflows/explore-nongo.yml']
jobs:
  poly-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: bash explore/nongo/poly-cache.sh
