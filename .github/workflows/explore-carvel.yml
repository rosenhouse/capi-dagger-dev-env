name: explore-carvel
on:
  push:
    branches: [claude/dagger-exploratory-testing-pjzg3f]
    paths: ['explore/carvel/**', '.github/workflows/explore-carvel.yml']
jobs:
  carvel:
    strategy:
      fail-fast: false
      matrix:
        script: [lifecycle, values]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: kubectl version --client 2>&1 | head -1; yq --version
      - run: explore/carvel/${{ matrix.script }}.sh
        shell: bash
        timeout-minutes: 43
