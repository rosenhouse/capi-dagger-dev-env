name: explore-multicluster
on:
  push:
    branches: [claude/dagger-exploratory-testing-pjzg3f]
    paths: ['explore/multicluster/**', '.github/workflows/explore-multicluster.yml']
jobs:
  scenario:
    strategy:
      fail-fast: false
      matrix:
        script: [second-cluster, lifecycle, capacity]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: bash explore/multicluster/${{ matrix.script }}.sh
