name: probe
on:
  pull_request:
    branches: [smol]
defaults:
  run:
    shell: bash
jobs:
  restore-exec:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/smolvm
        with:
          version: 1.22.0
          sha256: 00d2f057c963ff950846d4059af87bdddb7edf707750cdab863cb0879d6b339e
      - run: go build -o "$RUNNER_TEMP/devenv" ./cmd/devenv && "$RUNNER_TEMP/devenv" platform save
      - name: exec after restoring the platform
        run: |
          ckpt=$(ls ~/.cache/devenv/platform/*.checkpoint)
          diag() {
            smolvm machine ls
            smolvm machine status --name "$1" --json || true
            pgrep -af _boot-vm || true
            d=$(smolvm machine data-dir --name "$1")
            ls -la "$d" || true
            echo "--- agent-startup-error.log"; cat "$d/agent-startup-error.log" || true
            echo "--- agent-console.log"; tail -c 12000 "$d/agent-console.log" || true
            echo "--- host dmesg"; sudo dmesg | tail -30
            echo "--- start and boot output"; tail -c 20000 "$RUNNER_TEMP/start.log"
            echo
          }
          variant() { # name proxy remove
            local dst=probe-$1 start=(machine start --proxy "") t0
            [ "$2" = yes ] || start=(machine start)
            smolvm machine create --name "$dst" --from "$ckpt"
            if [ "$3" = yes ]; then
              remove=()
              for p in $(python3 -c 'import json,struct,sys; f=open(sys.argv[1],"rb"); f.seek(-64,2); n=struct.unpack("<Q",f.read(64)[44:52])[0]; f.seek(-64-n,2); [print("%d:%d" % (q["host"], q["guest"])) for q in json.loads(f.read(n))["checkpoint"]["network"]["ports"]]' "$ckpt"); do remove+=(--remove-port "$p"); done
              echo "captured ${remove[*]}"
              smolvm machine update --name "$dst" "${remove[@]}" -p 26443:6443 -p 27443:7443 -p 25000:5000
            else
              smolvm machine update --name "$dst" -p 26443:6443 -p 27443:7443 -p 25000:5000
            fi
            t0=$SECONDS
            SMOLVM_BOOT_DEBUG=1 RUST_LOG=smolvm=debug SMOLVM_IDLE_RECLAIM=off smolvm "${start[@]}" --name "$dst" >"$RUNNER_TEMP/start.log" 2>&1
            echo "start took $((SECONDS - t0)) s"
            ok=no
            sleep 2; smolvm machine ls
            for i in $(seq 1 6); do
              if RUST_LOG=smolvm=debug smolvm machine exec --name "$dst" -- uptime 2>"$RUNNER_TEMP/exec.err"; then ok="yes after $((SECONDS - t0)) s"; break; fi
              echo "exec $i failed at $((SECONDS - t0)) s:"; tail -5 "$RUNNER_TEMP/exec.err"
              [ "$i" = 1 ] && diag "$dst"
              curl -sk --max-time 3 https://localhost:26443/readyz && echo " mgmt readyz ok" || echo " mgmt readyz failed"
              sleep 5
            done
            echo "| $1 | $ok |" >>"$GITHUB_STEP_SUMMARY"
            diag "$dst"
            smolvm machine delete -f --name "$dst"
          }
          echo "| variant | exec |" >>"$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >>"$GITHUB_STEP_SUMMARY"
          variant ours yes yes
