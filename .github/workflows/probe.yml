name: probe
on:
  pull_request:
    branches: [smol]
defaults:
  run:
    shell: bash
jobs:
  restore-exec:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { prepare: full, settle: 0 }
          - { prepare: none, settle: 0 }
          - { prepare: nofill, settle: 0 }
          - { prepare: full, settle: 90 }
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/smolvm
        with:
          version: 1.22.0
          sha256: 00d2f057c963ff950846d4059af87bdddb7edf707750cdab863cb0879d6b339e
      - run: |
          grep -m1 'model name' /proc/cpuinfo
          go build -o "$RUNNER_TEMP/devenv" ./cmd/devenv && "$RUNNER_TEMP/devenv" platform save
        env:
          DEVENV_PROBE_PREPARE: ${{ matrix.prepare }}
          DEVENV_PROBE_SETTLE: ${{ matrix.settle }}
      - name: exec after restoring the platform
        run: |
          ckpt=$(ls ~/.cache/devenv/platform/*.checkpoint)
          ls -la "$ckpt"
          dst=probe
          remove=()
          for p in $(python3 -c 'import json,struct,sys; f=open(sys.argv[1],"rb"); f.seek(-64,2); n=struct.unpack("<Q",f.read(64)[44:52])[0]; f.seek(-64-n,2); [print("%d:%d" % (q["host"], q["guest"])) for q in json.loads(f.read(n))["checkpoint"]["network"]["ports"]]' "$ckpt"); do remove+=(--remove-port "$p"); done
          smolvm machine create --name "$dst" --from "$ckpt"
          smolvm machine update --name "$dst" "${remove[@]}" -p 26443:6443 -p 27443:7443 -p 25000:5000
          t0=$SECONDS
          SMOLVM_IDLE_RECLAIM=off smolvm machine start --name "$dst" --proxy ""
          echo "start took $((SECONDS - t0)) s"
          ok=no
          for i in $(seq 1 6); do
            smolvm machine ls
            if smolvm machine exec --name "$dst" -- uptime; then ok="yes after $((SECONDS - t0)) s"; break; fi
            curl -sk --max-time 3 https://localhost:26443/readyz && echo " mgmt readyz ok" || echo " mgmt readyz failed"
            sleep 5
          done
          echo "| ${{ matrix.prepare }} settle ${{ matrix.settle }} | $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2) | $ok |" >>"$GITHUB_STEP_SUMMARY"
          d=$(smolvm machine data-dir --name "$dst")
          echo "--- agent-startup-error.log"; cat "$d/agent-startup-error.log" || true
          echo "--- agent-console.log"; tail -c 6000 "$d/agent-console.log" || true
          echo "--- host dmesg"; sudo dmesg | tail -15
          smolvm machine delete -f --name "$dst"
