name: explore-warm
on:
  push:
    branches: [smol-warm-start-explore]
env:
  SMOLVM_VERSION: 1.22.0
  SMOLVM_LINUX_X86_64_SHA256: 00d2f057c963ff950846d4059af87bdddb7edf707750cdab863cb0879d6b339e
defaults:
  run:
    shell: bash
jobs:
  scenario:
    strategy:
      fail-fast: false
      matrix:
        script: [disk]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/smolvm
        with:
          version: ${{ env.SMOLVM_VERSION }}
          sha256: ${{ env.SMOLVM_LINUX_X86_64_SHA256 }}
      - run: bash hack/explore-warm/${{ matrix.script }}.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.script }}
          path: |
            .devenv/
            ~/.cache/devenv/platform-save/
            ${{ runner.temp }}/explore
          include-hidden-files: true
          retention-days: 3
