name: explore-legacy
on:
  push:
    branches: [claude/dagger-exploratory-testing-pjzg3f]
    paths: ['explore/legacy/**', '.github/workflows/explore-legacy.yml']
jobs:
  legacy:
    strategy:
      fail-fast: false
      matrix:
        job: [identical, different, crash]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Tools on the runner
        run: |
          echo "OBS: $(go version); $(kubectl version --client 2>&1 | head -1); $(kind version 2>&1); $(docker version -f '{{.Server.Version}}' 2>&1)"
      - name: ${{ matrix.job }}
        timeout-minutes: 38
        run: bash explore/legacy/recover.sh ${{ matrix.job }}
